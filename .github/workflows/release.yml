name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      # Release description = this version's section of CHANGELOG.md
      # (from "## <tag>" up to the next "## "). Fails if the entry is missing.
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 == "## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG.md entry for $GITHUB_REF_NAME"; exit 1; }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            main.js
            manifest.json
            styles.css
